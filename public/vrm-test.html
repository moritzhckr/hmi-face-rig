<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VRM Face Rig Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f1a;
      color: white;
      overflow: hidden;
    }
    #container { width: 100vw; height: 100vh; }
    #status {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.8); padding: 12px 24px; border-radius: 8px;
      font-size: 14px; z-index: 100; border: 1px solid #333;
    }
    #status.error { border-color: #ff4444; color: #ff6666; }
    #status.success { border-color: #44ff44; color: #66ff66; }
    #loading {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.8); padding: 8px 16px; border-radius: 4px;
      font-size: 12px; color: #888;
    }
    
    /* Side Menu */
    #menu-toggle {
      position: fixed; top: 20px; right: 20px; z-index: 200;
      width: 50px; height: 50px; background: rgba(0,0,0,0.8);
      border: 2px solid #444; border-radius: 50%; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px;
    }
    #menu-toggle span { width: 24px; height: 3px; background: #fff; border-radius: 2px; }
    
    #side-menu {
      position: fixed; top: 0; right: -300px; width: 280px; height: 100vh;
      background: linear-gradient(180deg, rgba(20,20,30,0.95) 0%, rgba(10,10,20,0.98) 100%);
      z-index: 150; padding: 80px 20px 20px; overflow-y: auto;
      transition: right 0.3s ease; border-left: 1px solid #333;
    }
    #side-menu.open { right: 0; }
    
    .menu-section { margin-bottom: 24px; }
    .menu-section h3 {
      font-size: 12px; text-transform: uppercase; color: #888;
      margin-bottom: 12px; letter-spacing: 1px;
    }
    .menu-btn {
      width: 100%; padding: 12px 16px; margin-bottom: 8px;
      background: rgba(255,255,255,0.05); border: 1px solid #333;
      border-radius: 8px; color: white; cursor: pointer;
      font-size: 14px; text-align: left; transition: all 0.2s;
    }
    .menu-btn:hover { background: rgba(255,255,255,0.1); border-color: #555; }
    .menu-btn.active { background: rgba(68,170,68,0.2); border-color: #4a4; color: #4f4; }
    
    /* Face controls */
    .face-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .face-btn {
      padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid #333;
      border-radius: 6px; color: #aaa; font-size: 11px; cursor: pointer; text-align: center;
    }
    .face-btn:hover { background: rgba(255,255,255,0.1); color: white; }
    .face-btn:active { background: rgba(68,170,68,0.3); }
  </style>
</head>
<body>
  <div id="status">Initializing...</div>
  <div id="loading"></div>
  <div id="container"></div>
  
  <!-- Menu Toggle -->
  <div id="menu-toggle" onclick="document.getElementById('side-menu').classList.toggle('open')">
    <span></span><span></span><span></span>
  </div>
  
  <!-- Side Menu -->
  <div id="side-menu">
    <div class="menu-section">
      <h3>Body Animation</h3>
      <button class="menu-btn active" id="btn-idle" onclick="setAnimation('idle')">🧍 Idle</button>
      <button class="menu-btn" id="btn-anim1" onclick="setAnimation('anim1')">1: walk_forward</button>
      <button class="menu-btn" id="btn-anim2" onclick="setAnimation('anim2')">2: walk_backward</button>
      <button class="menu-btn" id="btn-anim3" onclick="setAnimation('anim3')">3</button>
      <button class="menu-btn" id="btn-anim4" onclick="setAnimation('anim4')">4</button>
      <button class="menu-btn" id="btn-anim5" onclick="setAnimation('anim5')">5</button>
      <button class="menu-btn" id="btn-anim6" onclick="setAnimation('anim6')">6</button>
      <button class="menu-btn" id="btn-anim7" onclick="setAnimation('anim7')">7</button>
      <button class="menu-btn" id="btn-anim8" onclick="setAnimation('anim8')">8</button>
      <button class="menu-btn" id="btn-anim9" onclick="setAnimation('anim9')">9</button>
      <button class="menu-btn" id="btn-anim10" onclick="setAnimation('anim10')">10</button>
    </div>
    
    <div class="menu-section">
      <h3>Facial Expressions</h3>
      <div class="face-grid">
        <button class="face-btn" onmousedown="setFace('aa')" onmouseup="setFace('aa',0)" ontouchstart="event.preventDefault();setFace('aa')" ontouchend="event.preventDefault();setFace('aa',0)">Aa</button>
        <button class="face-btn" onmousedown="setFace('ih')" onmouseup="setFace('ih',0)" ontouchstart="event.preventDefault();setFace('ih')" ontouchend="event.preventDefault();setFace('ih',0)">Ih</button>
        <button class="face-btn" onmousedown="setFace('ou')" onmouseup="setFace('ou',0)" ontouchstart="event.preventDefault();setFace('ou')" ontouchend="event.preventDefault();setFace('ou',0)">Ou</button>
        <button class="face-btn" onmousedown="setFace('ee')" onmouseup="setFace('ee',0)" ontouchstart="event.preventDefault();setFace('ee')" ontouchend="event.preventDefault();setFace('ee',0)">Ee</button>
        <button class="face-btn" onmousedown="setFace('oh')" onmouseup="setFace('oh',0)" ontouchstart="event.preventDefault();setFace('oh')" ontouchend="event.preventDefault();setFace('oh',0)">Oh</button>
        <button class="face-btn" onmousedown="setFace('blink')" onmouseup="setFace('blink',0)" ontouchstart="event.preventDefault();setFace('blink')" ontouchend="event.preventDefault();setFace('blink',0)">Blink</button>
        <button class="face-btn" onmousedown="setFace('happy')" onmouseup="setFace('happy',0)" ontouchstart="event.preventDefault();setFace('happy')" ontouchend="event.preventDefault();setFace('happy',0)">😊</button>
        <button class="face-btn" onmousedown="setFace('sad')" onmouseup="setFace('sad',0)" ontouchstart="event.preventDefault();setFace('sad')" ontouchend="event.preventDefault();setFace('sad',0)">😢</button>
        <button class="face-btn" onmousedown="setFace('angry')" onmouseup="setFace('angry',0)" ontouchstart="event.preventDefault();setFace('angry')" ontouchend="event.preventDefault();setFace('angry',0)">😠</button>
      </div>
    </div>
    
    <div class="menu-section">
      <h3>Info</h3>
      <div style="font-size:11px;color:#666;">
        Drück <b>D</b> für Debug<br>
        Drag & Drop für neue VRM
      </div>
    </div>
    
    <div class="menu-section">
      <h3>Debug</h3>
      <button class="menu-btn" id="btn-stats" onclick="toggleStats()">📊 FPS Stats</button>
      <button class="menu-btn" id="btn-rig" onclick="toggleRig()">🦴 Debug Rig</button>
      <button class="menu-btn" id="btn-webcam" onclick="toggleWebcam()">📷 Webcam</button>
    </div>
  </div>
  
  <video id="webcam" autoplay playsinline style="position:fixed;bottom:20px;left:20px;width:160px;height:120px;border:2px solid #444;border-radius:8px;display:none;z-index:100;transform:scaleX(-1);"></video>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.js",
      "stats": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/libs/stats.module.js",
      "fbxloader": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/FBXLoader.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
    import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
    import { retargetAnimation } from './lib/index.esm.js';
    import Stats from 'three/addons/libs/stats.module.js';

    const statusEl = document.getElementById('status');
    const loadingEl = document.getElementById('loading');
    
    function setStatus(msg, type = 'info') {
      statusEl.textContent = msg;
      statusEl.className = type;
    }

    // Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    // Camera
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.6, 0.8);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.getElementById('container').appendChild(renderer.domElement);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1, 0);
    controls.enableDamping = true;
    controls.update();

    // Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const sunLight = new THREE.DirectionalLight(0xffffff, 1);
    sunLight.position.set(5, 10, 5);
    sunLight.castShadow = true;
    scene.add(sunLight);

    // Floor
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 20),
      new THREE.MeshStandardMaterial({ color: 0x222233, roughness: 0.8 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);
    scene.add(new THREE.GridHelper(20, 40, 0x444466, 0x333344));

    // VRM state
    let currentVRM = null;
    let mixer = null;
    let action = null;
    let currentAnimation = 'idle';
    let currentAnimationClip = null;
    let animationTime = 0;
    let idleClip = null;
    let walkClip = null;
    let walkBackClip = null;
    
    // Animation clips storage
    const animations = {};

    // Helper root for VRM debugging
    const helperRoot = new THREE.Group();
    helperRoot.renderOrder = 10000;
    scene.add(helperRoot);

    // FBX Loader for Idle animation
    const fbxLoader = new FBXLoader();
    
    // Load Idle FBX using vrm-mixamo-retarget library
    async function loadIdleFBX(vrm) {
      console.log('=== Loading Idle.fbx with vrm-mixamo-retarget ===');
      try {
        const fbx = await new Promise((resolve, reject) => {
          fbxLoader.load('/animations/Idle.fbx', resolve, undefined, reject);
        });
        
        console.log('FBX loaded');
        
        // Use the library to retarget
        const clip = retargetAnimation(fbx, vrm);
        
        if (clip) {
          clip.name = 'idle';
          animations['idle'] = clip;
          console.log('✅ Idle FBX converted with vrm-mixamo-retarget! Duration:', clip.duration);
          console.log('Sample tracks:', clip.tracks.slice(0, 3).map(t => t.name));
          return clip;
        } else {
          console.log('❌ retargetAnimation returned null');
        }
      } catch (e) {
        console.error('❌ Error loading Idle.fbx:', e);
      }
      return null;
    }

    // Stats
    const stats = new Stats();
    stats.dom.style.cssText = 'position:fixed;top:80px;left:20px;z-index:200';
    document.body.appendChild(stats.dom);
    stats.dom.style.display = 'none';
    
    let statsEnabled = false;
    let rigEnabled = false;
    let webcamEnabled = false;
    
    function toggleStats() {
      statsEnabled = !statsEnabled;
      stats.dom.style.display = statsEnabled ? 'block' : 'none';
      document.getElementById('btn-stats').classList.toggle('active', statsEnabled);
    }
    
    function toggleRig() {
      rigEnabled = !rigEnabled;
      helperRoot.visible = rigEnabled;
      document.getElementById('btn-rig').classList.toggle('active', rigEnabled);
    }
    
    async function toggleWebcam() {
      webcamEnabled = !webcamEnabled;
      const video = document.getElementById('webcam');
      const btn = document.getElementById('btn-webcam');
      
      if (webcamEnabled) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } });
          video.srcObject = stream;
          video.style.display = 'block';
          btn.classList.add('active');
        } catch (e) {
          console.error('Webcam error:', e);
          webcamEnabled = false;
        }
      } else {
        const stream = video.srcObject;
        if (stream) stream.getTracks().forEach(t => t.stop());
        video.srcObject = null;
        video.style.display = 'none';
        btn.classList.remove('active');
      }
    }
    
    window.toggleStats = toggleStats;
    window.toggleRig = toggleRig;
    window.toggleWebcam = toggleWebcam;

    // Load VRM
    setStatus('Loading VRM...', 'info');
    
    const loader = new GLTFLoader();
    loader.crossOrigin = 'anonymous';
    
    // IMPORTANT: Register VRMLoaderPlugin with autoUpdateHumanBones
    loader.register((parser) => {
      return new VRMLoaderPlugin(parser, { 
        helperRoot: helperRoot, 
        autoUpdateHumanBones: true 
      });
    });

    loader.load(
      '/vrm/test.vrm',
      (gltf) => {
        const vrm = gltf.userData.vrm;
        if (!vrm) {
          setStatus('✗ No VRM found', 'error');
          return;
        }

        // Optimize VRM
        VRMUtils.removeUnnecessaryVertices(gltf.scene);
        VRMUtils.combineSkeletons(gltf.scene);
        VRMUtils.combineMorphs(vrm);

        // Remove old VRM
        if (currentVRM) {
          scene.remove(currentVRM.scene);
          VRMUtils.deepDispose(currentVRM.scene);
        }

        currentVRM = vrm;
        scene.add(vrm.scene);

        // Disable frustum culling
        vrm.scene.traverse((obj) => { obj.frustumCulled = false; });

        // Create AnimationMixer
        mixer = new THREE.AnimationMixer(vrm.scene);
        
        // Debug: log bones in scene
        const sceneBones = [];
        vrm.scene.traverse((obj) => {
          if (obj.isBone) sceneBones.push(obj.name);
        });
        console.log('Scene bones:', sceneBones.slice(0, 20));

        // IMPORTANT: Rotate VRM0
        VRMUtils.rotateVRM0(vrm);

        console.log('VRM loaded:', vrm);

        // Load all animations
        const animFiles = {
          'anim1': '/animations/walk_forward.glb',
          'anim2': '/animations/walk_backward.glb',
          'anim3': '/animations/anim_797a510d-5b5c-4082-b.glb',
          'anim4': '/animations/anim_8edb8d05-9cba-46f8-8.glb',
          'anim5': '/animations/anim_4d0b10e5-38f7-4443-b.glb',
          'anim6': '/animations/anim_eb33bde4-2c28-46a4-a.glb',
          'anim7': '/animations/anim_a0f35981-ff7f-43be-b.glb',
          'anim8': '/animations/anim_83f8caf7-4b85-4f60-8.glb',
          'anim9': '/animations/anim_ce18f5d2-1d7f-470b-8.glb',
          'anim10': '/animations/anim_1b49202d-72dc-4b82-9.glb'
        };
        
        const loadPromises = Object.entries(animFiles).map(([name, url]) => {
          return loadMixamoAnimation(url, vrm).then(clip => {
            if (clip) {
              animations[name] = clip;
              console.log('Loaded:', name);
            }
          }).catch(e => console.error('Error loading', name, e));
        });
        
        Promise.all(loadPromises).then(() => {
          // Load Idle FBX
          return loadIdleFBX(vrm);
        }).then(() => {
          console.log('All animations loaded!');
          loadingEl.textContent = '';  // Hide loading
          setAnimation('anim10'); // Default animation
          setStatus('✓ Alles geladen!', 'success');
        });
      },
      (progress) => {
        if (progress.total > 0) {
          loadingEl.textContent = `Loading... ${Math.round(progress.loaded / progress.total * 100)}%`;
        }
      },
      (error) => {
        console.error(error);
        setStatus(`✗ Error: ${error.message}`, 'error');
      }
    );

    // Animation loop
    const clock = new THREE.Clock();
    let idleTime = 0;

    // Manual animation update function
    function updateManualAnimation(delta) {
      if (!currentAnimationClip || !currentVRM?.humanoid) return;
      
      animationTime += delta;
      const duration = currentAnimationClip.duration;
      const time = animationTime % duration;
      
      // Apply each track to the corresponding bone
      for (const track of currentAnimationClip.tracks) {
        const trackName = track.name;
        const dotIndex = trackName.lastIndexOf('.');
        if (dotIndex === -1) continue;
        
        const boneName = trackName.substring(0, dotIndex);
        const propertyName = trackName.substring(dotIndex + 1);
        
        // Get the VRM bone
        let boneNode = currentVRM.humanoid.getNormalizedBoneNode(boneName.replace('Normalized_', ''));
        if (!boneNode) continue;
        
        // Get the value at current time
        if (track instanceof THREE.QuaternionKeyframeTrack) {
          const value = track.evaluate(time);
          boneNode.quaternion.set(value[0], value[1], value[2], value[3]);
        } else if (track instanceof THREE.VectorKeyframeTrack && propertyName === 'position') {
          const value = track.evaluate(time);
          boneNode.position.set(value[0], value[1], value[2]);
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      
      const delta = clock.getDelta();
      controls.update();
      stats.update();
      
      // Update animation
      if (mixer) mixer.update(delta);
      
      // Debug: rotate head if animation not working
      if (currentVRM?.humanoid) {
        const head = currentVRM.humanoid.getRawBoneNode('head');
        if (head && Math.random() < 0.01) {
          console.log('Head bone found:', head.name);
        }
      }
      
      // Update VRM
      if (currentVRM) currentVRM.update(delta);
      
      // Facial idle (breathing + blinking)
      if (currentVRM?.expressionManager) {
        idleTime += delta;
        
        // Breathing
        currentVRM.expressionManager.setValue('aa', Math.max(0, Math.sin(idleTime * 2) * 0.08 + 0.12));
        
        // Random blink every 3-5 seconds
        if (Math.random() < 0.002) {
          currentVRM.expressionManager.setValue('blink', 1);
          setTimeout(() => {
            if (currentVRM?.expressionManager) currentVRM.expressionManager.setValue('blink', 0);
          }, 150);
        }
      }
      
      renderer.render(scene, camera);
    }
    animate();

    // Resize handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Debug toggle with 'd' key
    let debugMode = true;
    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'd') {
        debugMode = !debugMode;
        console.log('Debug:', debugMode ? 'ON' : 'OFF');
      }
    });
    
    // Make functions global for onclick handlers
    window.setAnimation = setAnimation;
    window.setFace = setFace;
    
    // Animation switcher
    function setFace(name, value = 1) {
      if (currentVRM?.expressionManager) {
        currentVRM.expressionManager.setValue(name, value);
      }
    }
    
    // Animation switcher - use AnimationMixer
    function setAnimation(name) {
      if (!mixer) return;
      
      const clip = animations[name];
      if (!clip) {
        console.log('No animation:', name);
        return;
      }
      
      // Use AnimationMixer
      mixer.timeScale = 1;
      const newAction = mixer.clipAction(clip);
      
      console.log('Playing animation. Tracks:', clip.tracks.slice(0, 3).map(t => t.name));
      
      if (action && action !== newAction) {
        action.crossFadeTo(newAction, 0.3, true);
      }
      newAction.reset().play();
      action = newAction;
      
      console.log('Switched to:', name);
    }
    
    // Remove manual animation code
    window.addEventListener('keydown', (e) => {
      if (!currentVRM?.expressionManager) return;
      const map = {'1':'aa','2':'ih','3':'ou','4':'ee','5':'oh','q':'happy','w':'sad','e':'angry','r':'surprised'};
      const expr = map[e.key.toLowerCase()];
      if (expr) currentVRM.expressionManager.setValue(expr, 1);
    });
    
    window.addEventListener('keyup', (e) => {
      if (!currentVRM?.expressionManager) return;
      const map = {'1':'aa','2':'ih','3':'ou','4':'ee','5':'oh','q':'happy','w':'sad','e':'angry','r':'surprised'};
      const expr = map[e.key.toLowerCase()];
      if (expr) currentVRM.expressionManager.setValue(expr, 0);
    });
  </script>
</body>
</html>
