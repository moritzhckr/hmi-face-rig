<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VRM Face Rig Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f1a;
      color: white;
      overflow: hidden;
    }
    #container { 
      width: 100vw; 
      height: 100vh;
    }
    #status {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 100;
      border: 1px solid #333;
    }
    #status.error {
      border-color: #ff4444;
      color: #ff6666;
    }
    #status.success {
      border-color: #44ff44;
      color: #66ff66;
    }
    #loading {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 12px;
      color: #888;
    }
    #avatar-selector {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 10px;
      background: linear-gradient(transparent, rgba(0,0,0,0.8));
      z-index: 100;
    }
    .avatar-thumb {
      width: 60px;
      height: 60px;
      border-radius: 8px;
      border: 2px solid #444;
      background: #222;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #888;
      transition: all 0.2s;
      overflow: hidden;
    }
    .avatar-thumb:hover {
      border-color: #666;
      transform: scale(1.05);
    }
    .avatar-thumb.active {
      border-color: #4a4;
      box-shadow: 0 0 10px rgba(68, 170, 68, 0.5);
    }
    .avatar-thumb.add-new {
      border-style: dashed;
      font-size: 24px;
    }
    #drop-zone {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #4a4;
      z-index: 1000;
      border: 4px dashed #4a4;
    }
    #drop-zone.active {
      display: flex;
    }
  </style>
</head>
<body>
  <div id="status">Initializing...</div>
  <div id="loading"></div>
  <div id="container"></div>
  <div id="drop-zone">Drop VRM file here!</div>
  <div id="avatar-selector"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.0/lib/three-vrm.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { VRMLoaderPlugin } from '@pixiv/three-vrm';

    const statusEl = document.getElementById('status');
    const loadingEl = document.getElementById('loading');
    
    function setStatus(msg, type = 'info') {
      statusEl.textContent = msg;
      statusEl.className = type;
    }

    // Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    // Camera
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.6, 0.8);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1;
    document.getElementById('container').appendChild(renderer.domElement);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.update();

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
    sunLight.position.set(5, 10, 5);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.1;
    sunLight.shadow.camera.far = 50;
    sunLight.shadow.camera.left = -10;
    sunLight.shadow.camera.right = 10;
    sunLight.shadow.camera.top = 10;
    sunLight.shadow.camera.bottom = -10;
    scene.add(sunLight);

    const fillLight = new THREE.DirectionalLight(0x8888ff, 0.3);
    fillLight.position.set(-5, 2, -5);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xff8888, 0.2);
    rimLight.position.set(0, 2, -5);
    scene.add(rimLight);

    // Floor
    const floorGeometry = new THREE.PlaneGeometry(20, 20);
    const floorMaterial = new THREE.MeshStandardMaterial({ 
      color: 0x222233,
      roughness: 0.8,
      metalness: 0.2
    });
    const floor = new THREE.Mesh(floorGeometry, floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Grid helper
    const gridHelper = new THREE.GridHelper(20, 40, 0x444466, 0x333344);
    gridHelper.position.y = 0.01;
    scene.add(gridHelper);

    let currentVRM = null;

    // Load VRM
    setStatus('Loading VRM model...', 'info');
    loadingEl.textContent = 'Downloading model...';

    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));

    loader.load(
      '/vrm/test.vrm',
      (gltf) => {
        const vrm = gltf.userData.vrm;
        
        if (vrm) {
          currentVRM = vrm;
          
          // Disable frustum culling
          vrm.scene.traverse((obj) => {
            obj.frustumCulled = false;
          });
          
          scene.add(vrm.scene);
          
          // Position and rotation
          vrm.scene.position.set(0, 0, 0);
          vrm.scene.rotation.y = 0;
          
          // Fix T-pose: Rotate arms down to natural position
          if (vrm.humanoid) {
            const rightArm = vrm.humanoid.getRawBoneNode('rightUpperArm');
            const leftArm = vrm.humanoid.getRawBoneNode('leftUpperArm');
            const rightForearm = vrm.humanoid.getRawBoneNode('rightLowerArm');
            const leftForearm = vrm.humanoid.getRawBoneNode('leftLowerArm');
            
            // Arms down at sides (natural standing)
            if (rightArm) rightArm.rotation.z = Math.PI / 2 - 0.3; // ~150 degrees
            if (leftArm) leftArm.rotation.z = -(Math.PI / 2 - 0.3);
            if (rightForearm) rightForearm.rotation.z = 0.2;
            if (leftForearm) leftForearm.rotation.z = -0.2;
          }
          
          console.log('VRM loaded successfully!', vrm);
          console.log('Expressions:', vrm.expressionManager?.expressionMap);
          
          setStatus('✓ VRM Loaded - press keys for expressions', 'success');
          
        } else {
          setStatus('✗ No VRM found in model file', 'error');
          loadingEl.textContent = '';
        }
      },
      (progress) => {
        if (progress.total > 0) {
          const percent = Math.round((progress.loaded / progress.total) * 100);
          loadingEl.textContent = `Loading... ${percent}%`;
        } else {
          loadingEl.textContent = 'Loading...';
        }
      },
      (error) => {
        console.error('Error loading VRM:', error);
        setStatus(`✗ Error: ${error.message}`, 'error');
        loadingEl.textContent = '';
      }
    );

    // Animation loop
    const clock = new THREE.Clock();
    let idleTime = 0;
    let lastBlinkTime = 0;
    const blinkInterval = 3 + Math.random() * 2; // Random blink every 3-5 seconds
    let isBlinking = false;
    let blinkProgress = 0;
    
    function animate() {
      requestAnimationFrame(animate);
      
      const delta = clock.getDelta();
      controls.update();
      
      // Idle animation - full body breathing + blinking
      if (currentVRM) {
        idleTime += delta;
        
        // === Facial Idle ===
        if (currentVRM.expressionManager) {
          // Breathing (mouth)
          const breath = Math.sin(idleTime * 2) * 0.08 + 0.12;
          currentVRM.expressionManager.setValue('aa', Math.max(0, breath));
          
          // Blinking
          if (!isBlinking && idleTime - lastBlinkTime > blinkInterval) {
            isBlinking = true;
            blinkProgress = 0;
          }
          
          if (isBlinking) {
            blinkProgress += delta * 8; // Blink speed
            const blinkValue = Math.sin(blinkProgress * Math.PI);
            currentVRM.expressionManager.setValue('blink', blinkValue);
            
            if (blinkProgress >= 1) {
              isBlinking = false;
              lastBlinkTime = idleTime;
              currentVRM.expressionManager.setValue('blink', 0);
            }
          }
        }
        
        // === Body Idle ===
        if (currentVRM.humanoid) {
          const bodyBreath = Math.sin(idleTime * 2) * 0.02;
          const sideBreath = Math.sin(idleTime * 1.5) * 0.01;
          const weightShift = Math.sin(idleTime * 0.5) * 0.01;
          
          // Spine/chest sway
          if (currentVRM.humanoid.getRawBoneNode('chest')) {
            currentVRM.humanoid.getRawBoneNode('chest').rotation.x = bodyBreath;
          }
          if (currentVRM.humanoid.getRawBoneNode('spine')) {
            currentVRM.humanoid.getRawBoneNode('spine').rotation.x = bodyBreath * 0.5;
          }
          
          // Head movement
          if (currentVRM.humanoid.getRawBoneNode('head')) {
            currentVRM.humanoid.getRawBoneNode('head').rotation.x = Math.sin(idleTime * 2) * 0.015 + Math.sin(idleTime * 5) * 0.003;
            currentVRM.humanoid.getRawBoneNode('head').rotation.y = Math.sin(idleTime * 0.8) * 0.02;
          }
          
          // Shoulder breathing + arm sway
          if (currentVRM.humanoid.getRawBoneNode('leftShoulder')) {
            currentVRM.humanoid.getRawBoneNode('leftShoulder').rotation.z = sideBreath;
          }
          if (currentVRM.humanoid.getRawBoneNode('rightShoulder')) {
            currentVRM.humanoid.getRawBoneNode('rightShoulder').rotation.z = -sideBreath;
          }
          
          // Arm sway (subtle pendulum movement)
          const armSway = Math.sin(idleTime * 1.2) * 0.02;
          const leftUpperArm = currentVRM.humanoid.getRawBoneNode('leftUpperArm');
          const rightUpperArm = currentVRM.humanoid.getRawBoneNode('rightUpperArm');
          const leftLowerArm = currentVRM.humanoid.getRawBoneNode('leftLowerArm');
          const rightLowerArm = currentVRM.humanoid.getRawBoneNode('rightLowerArm');
          
          if (leftUpperArm) {
            // Keep base arm position + subtle sway
            leftUpperArm.rotation.z = -(Math.PI / 2 - 0.3) + armSway;
          }
          if (rightUpperArm) {
            rightUpperArm.rotation.z = (Math.PI / 2 - 0.3) - armSway;
          }
          if (leftLowerArm) {
            leftLowerArm.rotation.z = -0.2 + armSway * 0.5;
          }
          if (rightLowerArm) {
            rightLowerArm.rotation.z = 0.2 - armSway * 0.5;
          }
          
          // Subtle hip/root weight shifting
          if (currentVRM.humanoid.getRawBoneNode('hips')) {
            currentVRM.humanoid.getRawBoneNode('hips').rotation.y = weightShift;
          }
        }
        
        currentVRM.update(delta);
      }
      
      renderer.render(scene, camera);
    }
    animate();

    // Handle resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Handle errors
    window.addEventListener('error', (e) => {
      console.error('Global error:', e);
      setStatus(`✗ Error: ${e.message}`, 'error');
    });

    // Uncaught errors
    window.addEventListener('unhandledrejection', (e) => {
      console.error('Unhandled rejection:', e.reason);
      setStatus(`✗ Error: ${e.reason}`, 'error');
    });

    // Expression controls
    const expressions = {
      '1': 'aa', '2': 'ih', '3': 'ou', '4': 'ee', '5': 'oh',
      'q': 'happy', 'w': 'sad', 'e': 'angry', 'r': 'surprised',
      'a': 'blink', 's': 'lookLeft', 'd': 'lookRight', 'f': 'lookUp', 'g': 'lookDown',
      'z': 'neutral', 'x': 'relaxed'
    };

    const expressionList = document.createElement('div');
    expressionList.style.cssText = 'position:fixed;bottom:20px;left:20px;background:rgba(0,0,0,0.8);padding:15px;border-radius:8px;font-size:12px;color:#888;max-width:300px;';
    expressionList.innerHTML = '<strong>Keys:</strong><br>' +
      '1-5: aa, ih, ou, ee, oh<br>' +
      'q,w,e,r: happy, sad, angry, surprise<br>' +
      'a,s,d,f,g: blink, left, right, up, down<br>' +
      'z,x: neutral, relaxed';
    document.body.appendChild(expressionList);

    let activeExpressions = {};

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (expressions[key] && currentVRM?.expressionManager) {
        const exprName = expressions[key];
        currentVRM.expressionManager.setValue(exprName, 1.0);
        setStatus(`Expression: ${exprName}`, 'success');
      }
    });

    window.addEventListener('keyup', (e) => {
      const key = e.key.toLowerCase();
      if (expressions[key] && currentVRM?.expressionManager) {
        const exprName = expressions[key];
        currentVRM.expressionManager.setValue(exprName, 0.0);
      }
    });

    // Avatar selector
    const avatars = [
      { name: 'Avatar', file: '/vrm/test.vrm' }
    ];
    let currentAvatar = 0;

    function renderAvatarSelector() {
      const container = document.getElementById('avatar-selector');
      container.innerHTML = '';
      
      avatars.forEach((avatar, index) => {
        const thumb = document.createElement('div');
        thumb.className = 'avatar-thumb' + (index === currentAvatar ? ' active' : '');
        thumb.textContent = avatar.name;
        thumb.onclick = () => loadAvatar(index);
        container.appendChild(thumb);
      });
      
      // Add new button
      const addBtn = document.createElement('div');
      addBtn.className = 'avatar-thumb add-new';
      addBtn.textContent = '+';
      addBtn.title = 'Drop VRM file here';
      addBtn.ondragover = (e) => e.preventDefault();
      addBtn.ondrop = handleDrop;
      container.appendChild(addBtn);
    }

    function loadAvatar(index) {
      if (index >= avatars.length) return;
      currentAvatar = index;
      const avatar = avatars[index];
      
      setStatus('Loading...', 'info');
      loader.load(
        avatar.file,
        (gltf) => {
          const vrm = gltf.userData.vrm;
          if (vrm) {
            if (currentVRM) {
              scene.remove(currentVRM.scene);
            }
            currentVRM = vrm;
            vrm.scene.traverse((obj) => { obj.frustumCulled = false; });
            scene.add(vrm.scene);
            vrm.scene.position.set(0, 0, 0);
            vrm.scene.rotation.y = 0;
            idleTime = 0;
            
            // Fix T-pose: Arms down
            if (vrm.humanoid) {
              const rightArm = vrm.humanoid.getRawBoneNode('rightUpperArm');
              const leftArm = vrm.humanoid.getRawBoneNode('leftUpperArm');
              const rightForearm = vrm.humanoid.getRawBoneNode('rightLowerArm');
              const leftForearm = vrm.humanoid.getRawBoneNode('leftLowerArm');
              if (rightArm) rightArm.rotation.z = Math.PI / 2 - 0.3;
              if (leftArm) leftArm.rotation.z = -(Math.PI / 2 - 0.3);
              if (rightForearm) rightForearm.rotation.z = 0.2;
              if (leftForearm) leftForearm.rotation.z = -0.2;
            }
            
            setStatus('✓ Avatar geladen: ' + avatar.name, 'success');
            renderAvatarSelector();
          }
        },
        undefined,
        (error) => {
          setStatus('✗ Fehler: ' + error.message, 'error');
        }
      );
    }

    function handleDrop(e) {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file && file.name.endsWith('.vrm')) {
        // Upload to server
        const formData = new FormData();
        formData.append('vrm', file);
        
        setStatus('Uploading...', 'info');
        
        fetch('/upload-vrm', {
          method: 'POST',
          body: formData
        })
        .then(r => r.json())
        .then(data => {
          avatars.push({ name: file.name.replace('.vrm', ''), file: data.path });
          loadAvatar(avatars.length - 1);
        })
        .catch(err => {
          setStatus('✗ Upload failed', 'error');
        });
      }
    }

    // Drag and drop on whole page
    document.body.addEventListener('dragover', (e) => {
      e.preventDefault();
      document.getElementById('drop-zone').classList.add('active');
    });
    
    document.body.addEventListener('dragleave', (e) => {
      if (!e.relatedTarget) {
        document.getElementById('drop-zone').classList.remove('active');
      }
    });
    
    document.body.addEventListener('drop', (e) => {
      e.preventDefault();
      document.getElementById('drop-zone').classList.remove('active');
      handleDrop(e);
    });

    // Initial render
    renderAvatarSelector();

    // TTS + Lip Sync
    const ttsContainer = document.createElement('div');
    ttsContainer.style.cssText = 'position:fixed;top:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);padding:15px;border-radius:8px;z-index:100;';
    ttsContainer.innerHTML = '<input id="tts-input" type="text" placeholder="Text zum Sprechen..." style="padding:8px;border-radius:4px;border:1px solid #333;background:#222;color:white;width:250px;"> <button id="tts-btn" style="padding:8px 16px;cursor:pointer;background:#4a4; border:none;border-radius:4px;color:white;">Sprechen</button>';
    document.body.appendChild(ttsContainer);

    // Improved Lip sync animation
    const mouthShapes = ['aa', 'ih', 'ou', 'ee', 'oh'];
    let lipSyncInterval = null;
    let isSpeaking = false;

    // Phoneme mapping for German
    const phonemeMap = {
      'a': 'aa', 'ä': 'aa', 'á': 'aa', 'à': 'aa',
      'e': 'ih', 'é': 'ih', 'è': 'ih', 'ê': 'ih', 'ë': 'ih',
      'i': 'ih', 'í': 'ih', 'ì': 'ih',
      'o': 'oh', 'ó': 'oh', 'ò': 'oh', 'ô': 'oh',
      'u': 'ou', 'ú': 'ou', 'ù': 'ou',
      'y': 'ih',
      'w': 'ou', 'v': 'ou',
      'b': 'aa', 'd': 'ih', 'f': 'ih', 'g': 'aa', 'h': 'aa',
      'j': 'ih', 'k': 'aa', 'l': 'ih', 'm': 'oh', 'n': 'ih',
      'p': 'oh', 'r': 'ih', 's': 'ih', 't': 'ih', 'z': 'ih',
      'th': 'aa', 'ch': 'ih', 'sch': 'ih', 'ng': 'ih'
    };

    function setMouth(shape, value = 1.0) {
      if (!currentVRM?.expressionManager) return;
      mouthShapes.forEach(s => currentVRM.expressionManager.setValue(s, 0));
      if (shape) currentVRM.expressionManager.setValue(shape, value);
    }

    function resetMouth() {
      isSpeaking = false;
      setMouth(null, 0);
    }

    function startLipSync(text) {
      if (lipSyncInterval) clearInterval(lipSyncInterval);
      
      // Clean text
      const cleanText = text.toLowerCase().replace(/[^a-zäöüß]/g, '');
      if (!cleanText.length) return;
      
      isSpeaking = true;
      
      // Estimate duration (average 3 syllables per second for German)
      const duration = Math.max(500, (cleanText.length / 5) * 1000);
      const interval = 80; // ~12 frames per second
      const steps = Math.floor(duration / interval);
      let step = 0;
      
      setMouth('aa', 0.3); // Start neutral-ish
      
      lipSyncInterval = setInterval(() => {
        if (!isSpeaking || !currentVRM?.expressionManager || step >= steps) {
          clearInterval(lipSyncInterval);
          resetMouth();
          return;
        }
        
        // Pick mouth shape based on phoneme
        const char = cleanText[Math.floor(Math.random() * cleanText.length)];
        const shape = phonemeMap[char] || 'aa';
        
        // Vary the intensity for more natural look
        const intensity = 0.5 + Math.random() * 0.5;
        setMouth(shape, intensity);
        
        step++;
      }, interval);
    }

    // Use Web Speech API
    const synth = window.speechSynthesis;
    const input = document.getElementById('tts-input');
    const btn = document.getElementById('tts-btn');

    btn.addEventListener('click', () => {
      const text = input.value || 'Hallo, ich kann sprechen!';
      
      // Use German voice if available
      const voices = synth.getVoices();
      const germanVoice = voices.find(v => v.lang.startsWith('de')) || voices[0];
      
      const utterance = new SpeechSynthesisUtterance(text);
      if (germanVoice) utterance.voice = germanVoice;
      utterance.lang = 'de-DE';
      utterance.rate = 0.9;
      
      utterance.onstart = () => startLipSync(text);
      
      synth.speak(utterance);
    });

    // Load voices
    speechSynthesis.onvoiceschanged = () => {
      console.log('Voices loaded:', speechSynthesis.getVoices().map(v => v.name));
    };

    // TTS Polling from server
    let lastText = '';
    const ttsStatus = document.createElement('div');
    ttsStatus.style.cssText = 'position:fixed;top:140px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);padding:10px;border-radius:8px;z-index:100;font-size:12px;color:#888;';
    ttsStatus.textContent = 'Warte auf TTS... (drück STRG+S zum Sagen)';
    document.body.appendChild(ttsStatus);

    function playAudioFile(text, filename) {
      if (!filename || isSpeaking) return;
      
      isSpeaking = true;
      ttsStatus.textContent = '🎤 Spiele: ' + text.substring(0, 30);
      console.log('🎧 Playing:', filename);
      
      const audioUrl = '/audio/' + filename;
      const audio = new Audio(audioUrl);
      
      // Start lip sync with the text
      startLipSync(text);
      
      audio.onended = () => {
        ttsStatus.textContent = '✓ Fertig';
        resetMouth();
        isSpeaking = false;
        lastText = '';
        // Clear the file after playing
        fetch('/audio/latest.json', {
          method: 'PUT',
          body: JSON.stringify({ text: '', file: '' })
        }).catch(() => {});
      };
      
      audio.onerror = (e) => {
        console.error('Audio Error:', e);
        ttsStatus.textContent = '✗ Fehler beim Abspielen';
        isSpeaking = false;
        lastText = '';
      };
      
      audio.play().catch(e => {
        console.error('Play Error:', e);
        isSpeaking = false;
      });
    }

    function speakText(text) {
      if (!text || text.trim() === '' || isSpeaking) return;
      
      isSpeaking = true;
      ttsStatus.textContent = '🔄 Generiere TTS...';
      console.log('🎤 Generating TTS for:', text);
      
      // Call TTS endpoint
      fetch('/tts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          text: text,
          voice: 'de-DE-ConradNeural'
        })
      })
      .then(r => r.json())
      .then(data => {
        if (data.success && data.file) {
          playAudioFile(text, data.file);
        } else {
          throw new Error(data.error || 'TTS failed');
        }
      })
      .catch(e => {
        console.error('TTS Error:', e);
        ttsStatus.textContent = '✗ TTS Fehler: ' + e.message;
        isSpeaking = false;
      });
    }

    function pollForTTS() {
      if (isSpeaking) return; // Don't poll while speaking
      
      fetch('/audio/latest.json')
        .then(r => r.json())
        .then(data => {
          console.log('📥 Poll:', data);
          if (data.text && data.text.trim() !== '' && data.text !== lastText && data.file) {
            // Clear the file immediately to prevent re-triggering
            fetch('/audio/latest.json', {
              method: 'PUT',
              body: JSON.stringify({ text: '', file: '' })
            }).catch(() => {});
            playAudioFile(data.text, data.file);
          }
        })
        .catch((e) => console.error('Poll error:', e));
    }

    // Poll every 2 seconds
    setInterval(pollForTTS, 2000);

    // Manual trigger: STRG+S
    window.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 's') {
        e.preventDefault();
        const input = document.getElementById('tts-input');
        if (input.value.trim()) {
          speakText(input.value);
        }
      }
    });

    // Poll immediately on load
    pollForTTS();
  </script>
</body>
</html>
