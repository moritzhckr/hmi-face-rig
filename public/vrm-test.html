<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VRM Face Rig Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f1a;
      color: white;
      overflow: hidden;
    }
    #container { width: 100vw; height: 100vh; touch-action: none; }
    #status {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.8); padding: 12px 24px; border-radius: 8px;
      font-size: 14px; z-index: 100; border: 1px solid #333;
    }
    #status.error { border-color: #ff4444; color: #ff6666; }
    #status.success { border-color: #44ff44; color: #66ff66; }
    #loading {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.8); padding: 8px 16px; border-radius: 4px;
      font-size: 12px; color: #888;
    }
    
    /* Side Menu */
    #menu-toggle {
      position: fixed; top: 20px; right: 20px; z-index: 200;
      width: 50px; height: 50px; background: rgba(0,0,0,0.8);
      border: 2px solid #444; border-radius: 50%; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px;
    }
    #menu-toggle span { width: 24px; height: 3px; background: #fff; border-radius: 2px; }
    
    #side-menu {
      position: fixed; top: 0; right: -300px; width: 280px; height: 100vh;
      background: linear-gradient(180deg, rgba(20,20,30,0.95) 0%, rgba(10,10,20,0.98) 100%);
      z-index: 150; padding: 80px 20px 20px; overflow-y: auto;
      transition: right 0.3s ease; border-left: 1px solid #333;
    }
    #side-menu.open { right: 0; }
    
    .menu-section { margin-bottom: 24px; }
    .menu-section h3 {
      font-size: 12px; text-transform: uppercase; color: #888;
      margin-bottom: 12px; letter-spacing: 1px;
    }
    .menu-btn {
      width: 100%; padding: 12px 16px; margin-bottom: 8px;
      background: rgba(255,255,255,0.05); border: 1px solid #333;
      border-radius: 8px; color: white; cursor: pointer;
      font-size: 14px; text-align: left; transition: all 0.2s;
    }
    .menu-btn:hover { background: rgba(255,255,255,0.1); border-color: #555; }
    .menu-btn.active { background: rgba(68,170,68,0.2); border-color: #4a4; color: #4f4; }
    
    /* Face controls */
    .face-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .face-btn {
      padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid #333;
      border-radius: 6px; color: #aaa; font-size: 11px; cursor: pointer; text-align: center;
    }
    .face-btn:hover { background: rgba(255,255,255,0.1); color: white; }
    .face-btn:active { background: rgba(68,170,68,0.3); }

    /* Center speech panel */
    #speech-panel {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      z-index: 220;
      width: min(92vw, 560px);
      background: rgba(12, 12, 20, 0.86);
      border: 1px solid #3a3a4a;
      border-radius: 14px;
      padding: 10px;
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }
    #speak-input {
      width: 100%; min-height: 68px;
      background: rgba(255,255,255,0.06); border: 1px solid #333;
      border-radius: 10px; color: white; padding: 10px;
      font-size: 14px; resize: vertical;
    }
    #speech-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .speech-btn {
      min-height: 44px; border-radius: 10px; border: 1px solid #3d3d4a;
      background: rgba(255,255,255,0.08); color: white; cursor: pointer;
      font-size: 14px;
    }
    .speech-btn:active { transform: scale(0.99); }
    #btn-hold-to-speak.active { background: rgba(80, 30, 30, 0.9); border-color: #d55; color: #fff; }
    #speech-hint { font-size: 11px; color: #8f8f9c; margin-top: 6px; text-align: center; }

    /* Mobile optimization */
    @media (max-width: 900px) {
      #container { width: 100vw; height: 100dvh; }

      #status {
        top: max(10px, env(safe-area-inset-top));
        width: calc(100vw - 24px);
        max-width: 540px;
        padding: 10px 12px;
        font-size: 13px;
        text-align: center;
      }

      #loading {
        bottom: max(10px, env(safe-area-inset-bottom));
        font-size: 11px;
      }

      #menu-toggle {
        top: max(12px, env(safe-area-inset-top));
        right: max(12px, env(safe-area-inset-right));
        width: 52px;
        height: 52px;
        background: rgba(0,0,0,0.9);
      }

      #side-menu {
        width: min(92vw, 420px);
        right: -100vw;
        padding: calc(72px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
      }

      .menu-section h3 { font-size: 11px; }

      .menu-btn {
        min-height: 46px;
        font-size: 15px;
        border-radius: 10px;
        padding: 12px 14px;
      }

      .face-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }

      .face-btn {
        min-height: 44px;
        font-size: 13px;
        border-radius: 9px;
      }

      #speech-panel {
        width: min(96vw, 620px);
        bottom: calc(10px + env(safe-area-inset-bottom));
        padding: 10px;
      }

      #speak-input {
        min-height: 96px !important;
        font-size: 16px !important; /* prevent iOS zoom */
      }

      #webcam {
        width: 120px !important;
        height: 90px !important;
        bottom: calc(12px + env(safe-area-inset-bottom)) !important;
        left: calc(12px + env(safe-area-inset-left)) !important;
      }
    }
  </style>
</head>
<body>
  <div id="status">Initializing...</div>
  <div id="loading"></div>
  <div id="container"></div>

  <!-- Centered speech controls -->
  <div id="speech-panel">
    <textarea id="speak-input" placeholder="Schreib etwas oder halte den Mic-Button..." autocomplete="off"></textarea>
    <div id="speech-actions">
      <button class="speech-btn" id="btn-speak" onclick="submitSpeak()">🎤 Senden</button>
      <button class="speech-btn" id="btn-hold-to-speak">🗣️ Hold to Speak</button>
    </div>
    <div id="speech-hint">Enter = senden · Mic gedrückt halten zum Sprechen</div>
  </div>
  
  <!-- Menu Toggle -->
  <div id="menu-toggle" onclick="toggleMenu()">
    <span></span><span></span><span></span>
  </div>
  
  <!-- Side Menu -->
  <div id="side-menu">
    <div class="menu-section">
      <h3>Body Animation</h3>
      <button class="menu-btn active" id="btn-idle" onclick="setAnimation('idle')">🧍 Idle</button>
      <button class="menu-btn" id="btn-armStretch" onclick="setAnimation('armStretch')">💪 Arm Stretching</button>
      <button class="menu-btn" id="btn-defeated" onclick="setAnimation('defeated')">😞 Defeated</button>
      <button class="menu-btn" id="btn-hipHop" onclick="setAnimation('hipHop')">🕺 Hip Hop</button>
      <button class="menu-btn" id="btn-praying" onclick="setAnimation('praying')">🙏 Praying</button>
      <button class="menu-btn" id="btn-arguing" onclick="setAnimation('arguing')">😠 Arguing</button>
      <button class="menu-btn" id="btn-talking" onclick="setAnimation('talking')">💬 Talking</button>
    </div>
    
    <div class="menu-section">
      <h3>Facial Expressions</h3>
      <div class="face-grid">
        <button class="face-btn" onmousedown="setFace('aa')" onmouseup="setFace('aa',0)" ontouchstart="event.preventDefault();setFace('aa')" ontouchend="event.preventDefault();setFace('aa',0)">Aa</button>
        <button class="face-btn" onmousedown="setFace('ih')" onmouseup="setFace('ih',0)" ontouchstart="event.preventDefault();setFace('ih')" ontouchend="event.preventDefault();setFace('ih',0)">Ih</button>
        <button class="face-btn" onmousedown="setFace('ou')" onmouseup="setFace('ou',0)" ontouchstart="event.preventDefault();setFace('ou')" ontouchend="event.preventDefault();setFace('ou',0)">Ou</button>
        <button class="face-btn" onmousedown="setFace('ee')" onmouseup="setFace('ee',0)" ontouchstart="event.preventDefault();setFace('ee')" ontouchend="event.preventDefault();setFace('ee',0)">Ee</button>
        <button class="face-btn" onmousedown="setFace('oh')" onmouseup="setFace('oh',0)" ontouchstart="event.preventDefault();setFace('oh')" ontouchend="event.preventDefault();setFace('oh',0)">Oh</button>
        <button class="face-btn" onmousedown="setFace('blink')" onmouseup="setFace('blink',0)" ontouchstart="event.preventDefault();setFace('blink')" ontouchend="event.preventDefault();setFace('blink',0)">Blink</button>
        <button class="face-btn" onmousedown="setFace('happy')" onmouseup="setFace('happy',0)" ontouchstart="event.preventDefault();setFace('happy')" ontouchend="event.preventDefault();setFace('happy',0)">😊</button>
        <button class="face-btn" onmousedown="setFace('sad')" onmouseup="setFace('sad',0)" ontouchstart="event.preventDefault();setFace('sad')" ontouchend="event.preventDefault();setFace('sad',0)">😢</button>
        <button class="face-btn" onmousedown="setFace('angry')" onmouseup="setFace('angry',0)" ontouchstart="event.preventDefault();setFace('angry')" ontouchend="event.preventDefault();setFace('angry',0)">😠</button>
      </div>
    </div>
    
    <!-- speech controls moved to centered overlay -->

    <div class="menu-section">
      <h3>Info</h3>
      <div style="font-size:11px;color:#666;">
        Drück <b>D</b> für Debug<br>
        Drag & Drop für neue VRM
      </div>
    </div>
    
    <div class="menu-section">
      <h3>Debug</h3>
      <button class="menu-btn" id="btn-stats" onclick="toggleStats()">📊 FPS Stats</button>
      <button class="menu-btn" id="btn-rig" onclick="toggleRig()">🦴 Debug Rig</button>
      <button class="menu-btn" id="btn-webcam" onclick="toggleWebcam()">📷 Facecam</button>
    </div>
  </div>
  
  <video id="webcam" autoplay playsinline style="position:fixed;bottom:20px;left:20px;width:160px;height:120px;border:2px solid #444;border-radius:8px;display:none;z-index:100;transform:scaleX(-1);"></video>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.js",
      "stats": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/libs/stats.module.js",
      "fbxloader": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/FBXLoader.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
    import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
    import { retargetAnimation } from './lib/index.esm.js';
    import Stats from 'three/addons/libs/stats.module.js';

    const statusEl = document.getElementById('status');
    const loadingEl = document.getElementById('loading');
    const sideMenuEl = document.getElementById('side-menu');
    const menuToggleEl = document.getElementById('menu-toggle');
    
    function setStatus(msg, type = 'info') {
      statusEl.textContent = msg;
      statusEl.className = type;
    }

    // Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    // Camera
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.6, 0.8);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.getElementById('container').appendChild(renderer.domElement);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1, 0);
    controls.enableDamping = true;
    controls.update();

    // Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const sunLight = new THREE.DirectionalLight(0xffffff, 1);
    sunLight.position.set(5, 10, 5);
    sunLight.castShadow = true;
    scene.add(sunLight);

    // Floor
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 20),
      new THREE.MeshStandardMaterial({ color: 0x222233, roughness: 0.8 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);
    scene.add(new THREE.GridHelper(20, 40, 0x444466, 0x333344));

    // VRM state
    let currentVRM = null;
    let mixer = null;
    let action = null;
    let currentAnimation = 'idle';
    let currentAnimationClip = null;
    let animationTime = 0;
    let idleClip = null;
    
    // Animation clips storage
    const animations = {};

    // Helper root for VRM debugging
    const helperRoot = new THREE.Group();
    helperRoot.renderOrder = 10000;
    helperRoot.visible = false;
    scene.add(helperRoot);

    // Animation loading is handled below with unified loader

    // Stats
    const stats = new Stats();
    stats.dom.style.cssText = 'position:fixed;top:80px;left:20px;z-index:200';
    document.body.appendChild(stats.dom);
    stats.dom.style.display = 'none';
    
    let statsEnabled = false;
    let rigEnabled = false;
    let webcamEnabled = false;
    
    // Sync button states on load
    document.getElementById('btn-stats').classList.remove('active');
    document.getElementById('btn-rig').classList.remove('active');
    document.getElementById('btn-webcam').classList.remove('active');
    
    function toggleStats() {
      statsEnabled = !statsEnabled;
      stats.dom.style.display = statsEnabled ? 'block' : 'none';
      document.getElementById('btn-stats').classList.toggle('active', statsEnabled);
    }
    
    function toggleRig() {
      rigEnabled = !rigEnabled;
      helperRoot.visible = rigEnabled;
      document.getElementById('btn-rig').classList.toggle('active', rigEnabled);
    }
    
    async function toggleWebcam() {
      webcamEnabled = !webcamEnabled;
      const btn = document.getElementById('btn-webcam');
      
      if (webcamEnabled) {
        // Position camera ~40cm in front of head
        if (currentVRM?.humanoid) {
          const head = currentVRM.humanoid.getNormalizedBoneNode('head');
          if (head) {
            const headWorldPos = new THREE.Vector3();
            head.getWorldPosition(headWorldPos);
            camera.position.set(headWorldPos.x, headWorldPos.y + 0.05, headWorldPos.z + 0.4);
            controls.target.copy(headWorldPos);
            controls.update();
          }
        }
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
        
        // Reset camera position
        camera.position.set(0, 1.6, 0.8);
        controls.target.set(0, 1, 0);
        controls.update();
      }
    }
    
    window.toggleStats = toggleStats;
    window.toggleRig = toggleRig;
    window.toggleWebcam = toggleWebcam;

    window.toggleMenu = function() {
      sideMenuEl.classList.toggle('open');
    };

    function closeMenuOnMobile() {
      if (window.matchMedia('(max-width: 900px)').matches) {
        sideMenuEl.classList.remove('open');
      }
    }

    document.addEventListener('click', (e) => {
      const clickedInsideMenu = sideMenuEl.contains(e.target);
      const clickedToggle = menuToggleEl.contains(e.target);
      if (!clickedInsideMenu && !clickedToggle) {
        sideMenuEl.classList.remove('open');
      }
    });
    
    // Global loaders for animation loading
    window.gltfLoader = new GLTFLoader();
    window.gltfLoader.crossOrigin = 'anonymous';
    window.fbxLoader = new FBXLoader();
    
    // Load VRM
    setStatus('Loading VRM...', 'info');
    
    const loader = window.gltfLoader;
    
    // IMPORTANT: Register VRMLoaderPlugin with autoUpdateHumanBones
    loader.register((parser) => {
      return new VRMLoaderPlugin(parser, { 
        helperRoot: helperRoot, 
        autoUpdateHumanBones: true 
      });
    });

    loader.load(
      '/vrm/test.vrm',
      (gltf) => {
        const vrm = gltf.userData.vrm;
        if (!vrm) {
          setStatus('✗ No VRM found', 'error');
          return;
        }

        // Optimize VRM
        VRMUtils.removeUnnecessaryVertices(gltf.scene);
        VRMUtils.combineSkeletons(gltf.scene);
        VRMUtils.combineMorphs(vrm);

        // Remove old VRM
        if (currentVRM) {
          scene.remove(currentVRM.scene);
          VRMUtils.deepDispose(currentVRM.scene);
        }

        currentVRM = vrm;
        scene.add(vrm.scene);

        // Disable frustum culling
        vrm.scene.traverse((obj) => { obj.frustumCulled = false; });
        
        // Ensure debug rig stays hidden unless toggled
        helperRoot.visible = rigEnabled;

        // Create AnimationMixer
        mixer = new THREE.AnimationMixer(vrm.scene);
        
        // IMPORTANT: Rotate VRM0
        VRMUtils.rotateVRM0(vrm);

        console.log('VRM loaded');

        // Load all animations
        const animFiles = {
          'idle': { url: '/animations/Idle.fbx', type: 'fbx' },
          'armStretch': { url: '/animations/arm_stretching.fbx', type: 'fbx' },
          'defeated': { url: '/animations/defeated.fbx', type: 'fbx' },
          'hipHop': { url: '/animations/hip_hop_dancing.fbx', type: 'fbx' },
          'praying': { url: '/animations/praying.fbx', type: 'fbx' },
          'arguing': { url: '/animations/standing_arguing.fbx', type: 'fbx' },
          'talking': { url: '/animations/talking.fbx', type: 'fbx' }
        };
        
        // Helper to load based on type
        async function loadAnimation(name, config) {
          if (config.type === 'fbx') {
            const fbx = await new Promise((resolve, reject) => window.fbxLoader.load(config.url, resolve, undefined, reject));
            return retargetAnimation(fbx, vrm);
          } else {
            const gltf = await new Promise((resolve, reject) => window.gltfLoader.load(config.url, resolve, undefined, reject));
            if (gltf.animations && gltf.animations.length > 0) {
              return retargetAnimation(gltf, vrm);
            }
          }
          return null;
        }
        
        const loadPromises = Object.entries(animFiles).map(([name, config]) => {
          return loadAnimation(name, config).then(clip => {
            if (clip) animations[name] = clip;
          }).catch(e => console.error('Error loading', name, e));
        });
        
        Promise.all(loadPromises).then(() => {
          console.log('All animations loaded');
          loadingEl.textContent = '';  // Hide loading
          setAnimation('idle'); // Default animation
          setStatus('✓ Alles geladen!', 'success');
        });
      },
      (progress) => {
        if (progress.total > 0) {
          loadingEl.textContent = `Loading... ${Math.round(progress.loaded / progress.total * 100)}%`;
        }
      },
      (error) => {
        console.error(error);
        setStatus(`✗ Error: ${error.message}`, 'error');
      }
    );

    // Animation loop
    const clock = new THREE.Clock();
    let idleTime = 0;

    // Manual animation update function
    function updateManualAnimation(delta) {
      if (!currentAnimationClip || !currentVRM?.humanoid) return;
      
      animationTime += delta;
      const duration = currentAnimationClip.duration;
      const time = animationTime % duration;
      
      // Apply each track to the corresponding bone
      for (const track of currentAnimationClip.tracks) {
        const trackName = track.name;
        const dotIndex = trackName.lastIndexOf('.');
        if (dotIndex === -1) continue;
        
        const boneName = trackName.substring(0, dotIndex);
        const propertyName = trackName.substring(dotIndex + 1);
        
        // Get the VRM bone
        let boneNode = currentVRM.humanoid.getNormalizedBoneNode(boneName.replace('Normalized_', ''));
        if (!boneNode) continue;
        
        // Get the value at current time
        if (track instanceof THREE.QuaternionKeyframeTrack) {
          const value = track.evaluate(time);
          boneNode.quaternion.set(value[0], value[1], value[2], value[3]);
        } else if (track instanceof THREE.VectorKeyframeTrack && propertyName === 'position') {
          const value = track.evaluate(time);
          boneNode.position.set(value[0], value[1], value[2]);
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      
      const delta = clock.getDelta();
      controls.update();
      stats.update();
      
      // Update animation
      if (mixer) mixer.update(delta);
      
      // Debug: rotate head if animation not working
      if (currentVRM?.humanoid) {
        // Head bone is available for manual animation if needed
      }
      
      // Update VRM
      if (currentVRM) currentVRM.update(delta);
      
      // Facial idle (breathing + blinking)
      if (currentVRM?.expressionManager) {
        idleTime += delta;
        
        // Breathing
        currentVRM.expressionManager.setValue('aa', Math.max(0, Math.sin(idleTime * 2) * 0.08 + 0.12));
        
        // Random blink every 3-5 seconds
        if (Math.random() < 0.002) {
          currentVRM.expressionManager.setValue('blink', 1);
          setTimeout(() => {
            if (currentVRM?.expressionManager) currentVRM.expressionManager.setValue('blink', 0);
          }, 150);
        }
      }
      
      renderer.render(scene, camera);
    }
    animate();

    // Resize handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Debug toggle with 'd' key
    let debugMode = true;
    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'd') {
        debugMode = !debugMode;
        console.log('Debug:', debugMode ? 'ON' : 'OFF');
      }
    });
    
    // Make functions global for onclick handlers
    window.setAnimation = setAnimation;
    window.setFace = setFace;
    
    // Animation switcher
    function setFace(name, value = 1) {
      if (currentVRM?.expressionManager) {
        currentVRM.expressionManager.setValue(name, value);
      }
    }
    
    // Animation switcher - use AnimationMixer
    function setAnimation(name) {
      if (!mixer) return;
      
      const clip = animations[name];
      if (!clip) return;
      
      // Update button states
      document.querySelectorAll('#side-menu .menu-btn').forEach(btn => btn.classList.remove('active'));
      const btnId = 'btn-' + name;
      const btn = document.getElementById(btnId);
      if (btn) btn.classList.add('active');
      closeMenuOnMobile();
      
      // Update current animation tracking
      currentAnimation = name;
      currentAnimationClip = clip;
      
      // Use AnimationMixer
      mixer.timeScale = 1;
      const newAction = mixer.clipAction(clip);
      
      if (action && action !== newAction) {
        action.crossFadeTo(newAction, 0.3, true);
      }
      newAction.reset().play();
      action = newAction;
    }
    
    // TTS + Lip Sync
    const mouthShapes = ['aa', 'ih', 'ou', 'ee', 'oh'];
    let lipSyncAnimFrame = null;
    let isSpeaking = false;
    let currentQueueId = null;
    let audioContext = null;
    let analyser = null;
    let audioDataArray = null;

    function reportPlaybackEvent(type, detail = {}) {
      fetch('/audio/events', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type, queueId: currentQueueId, ...detail })
      }).catch(() => {});
    }

    function getAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.5;
        audioDataArray = new Uint8Array(analyser.frequencyBinCount);
      }
      return { audioContext, analyser, audioDataArray };
    }

    function setMouth(shape, value = 1.0) {
      if (!currentVRM?.expressionManager) return;
      mouthShapes.forEach(s => currentVRM.expressionManager.setValue(s, 0));
      if (shape) currentVRM.expressionManager.setValue(shape, value);
    }

    function resetMouth() {
      isSpeaking = false;
      if (lipSyncAnimFrame) {
        cancelAnimationFrame(lipSyncAnimFrame);
        lipSyncAnimFrame = null;
      }
      setMouth(null, 0);
    }

    function startLipSyncFromAudio(audioElement) {
      const { audioContext: ctx, analyser: an, audioDataArray: dataArr } = getAudioContext();
      
      // Resume context if suspended (browser autoplay policy)
      if (ctx.state === 'suspended') ctx.resume();
      
      // Connect audio element to analyser
      const source = ctx.createMediaElementSource(audioElement);
      source.connect(an);
      an.connect(ctx.destination);
      
      isSpeaking = true;

      function updateLipSync() {
        if (!isSpeaking || !currentVRM?.expressionManager) {
          resetMouth();
          return;
        }
        
        an.getByteFrequencyData(dataArr);
        
        // Get amplitude from different frequency bands
        const low = dataArr.slice(0, 8).reduce((a, b) => a + b, 0) / 8;     // ~0-300Hz (vowels)
        const mid = dataArr.slice(8, 24).reduce((a, b) => a + b, 0) / 16;   // ~300-1kHz
        const high = dataArr.slice(24, 64).reduce((a, b) => a + b, 0) / 40; // ~1k-4kHz (consonants)
        
        // Normalize to 0-1
        const lowN = Math.min(1, low / 180);
        const midN = Math.min(1, mid / 160);
        const highN = Math.min(1, high / 140);
        
        // Overall volume for mouth opening
        const volume = (lowN * 0.5 + midN * 0.3 + highN * 0.2);
        
        // Map frequency bands to mouth shapes
        if (volume < 0.05) {
          // Silence - close mouth
          mouthShapes.forEach(s => currentVRM.expressionManager.setValue(s, 0));
        } else {
          // Reset all first
          mouthShapes.forEach(s => currentVRM.expressionManager.setValue(s, 0));
          
          // Low frequencies → wide open (aa)
          // Mid frequencies → medium open (oh/ou)
          // High frequencies → narrow (ih/ee)
          if (lowN > midN && lowN > highN) {
            currentVRM.expressionManager.setValue('aa', volume * 0.9);
            currentVRM.expressionManager.setValue('oh', volume * 0.2);
          } else if (highN > lowN) {
            currentVRM.expressionManager.setValue('ih', volume * 0.7);
            currentVRM.expressionManager.setValue('ee', volume * 0.3);
          } else {
            currentVRM.expressionManager.setValue('oh', volume * 0.6);
            currentVRM.expressionManager.setValue('ou', volume * 0.4);
          }
        }
        
        lipSyncAnimFrame = requestAnimationFrame(updateLipSync);
      }
      
      updateLipSync();
    }

    // TTS Status Display
    const ttsStatus = document.createElement('div');
    ttsStatus.style.cssText = 'position:fixed;top:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);padding:10px;border-radius:8px;z-index:100;font-size:12px;color:#888;';
    ttsStatus.textContent = 'Klick für Audio aktivieren';
    document.body.appendChild(ttsStatus);
    
    let audioEnabled = false;
    let voiceRecognition = null;
    let isListening = false;
    ttsStatus.style.cursor = 'pointer';
    ttsStatus.onclick = () => {
      audioEnabled = true;
      ttsStatus.textContent = '✓ Audio aktiviert';
    };

    function derivePerformanceFromText(text = '') {
      const t = text.toLowerCase();
      const hasQuestion = t.includes('?') || /\b(wie|was|warum|wann|wo)\b/.test(t);
      const positive = /\b(super|nice|perfekt|cool|geil|stark|yes|top)\b/.test(t);
      const empathic = /\b(sorry|tut mir leid|schade|verstehe|fühl)\b/.test(t);

      if (positive) return { animation: 'talking', face: 'happy', intensity: 0.45 };
      if (empathic) return { animation: 'idle', face: 'sad', intensity: 0.25 };
      if (hasQuestion) return { animation: 'talking', face: 'surprised', intensity: 0.25 };
      return { animation: 'talking', face: null, intensity: 0 };
    }

    function playAudioFile(text, filename, queueId = null) {
      if (!filename || isSpeaking || !audioEnabled) {
        if (!audioEnabled) ttsStatus.textContent = 'Klick für Audio aktivieren!';
        return;
      }
      
      isSpeaking = true;
      currentQueueId = queueId;
      reportPlaybackEvent('playback.start', { file: filename, text });
      ttsStatus.textContent = '🔊 Spiele: ' + text.substring(0, 30);

      const performance = derivePerformanceFromText(text);
      if (performance.animation) setAnimation(performance.animation);
      if (performance.face && currentVRM?.expressionManager) {
        currentVRM.expressionManager.setValue(performance.face, performance.intensity);
      }
      
      const audioUrl = '/audio/' + filename;
      const audio = new Audio(audioUrl);
      audio.crossOrigin = 'anonymous'; // Required for Web Audio API
      
      audio.onended = () => {
        ttsStatus.textContent = '✓ Fertig';
        reportPlaybackEvent('playback.end', { file: filename, text });
        resetMouth();
        ['happy', 'sad', 'angry', 'surprised'].forEach(expr => {
          if (currentVRM?.expressionManager) currentVRM.expressionManager.setValue(expr, 0);
        });
        setAnimation('idle');
        currentQueueId = null;
        lastText = '';
      };
      
      audio.onerror = (e) => {
        console.error('Audio Error:', e);
        ttsStatus.textContent = '✗ Fehler';
        reportPlaybackEvent('playback.error', { file: filename, text, detail: String(e?.message || 'audio error') });
        ['happy', 'sad', 'angry', 'surprised'].forEach(expr => {
          if (currentVRM?.expressionManager) currentVRM.expressionManager.setValue(expr, 0);
        });
        setAnimation('idle');
        isSpeaking = false;
        currentQueueId = null;
      };
      
      audio.play().then(() => {
        startLipSyncFromAudio(audio);
      }).catch(e => {
        console.error('Play Error:', e);
        reportPlaybackEvent('playback.error', { file: filename, text, detail: String(e?.message || 'play error') });
        ['happy', 'sad', 'angry', 'surprised'].forEach(expr => {
          if (currentVRM?.expressionManager) currentVRM.expressionManager.setValue(expr, 0);
        });
        setAnimation('idle');
        isSpeaking = false;
        currentQueueId = null;
      });
    }

    let lastText = '';
    function pollForTTS() {
      if (isSpeaking) return;
      fetch('/audio/queue?consume=1')
        .then(r => r.json())
        .then(data => {
          const item = data?.item;
          if (item?.text && item?.file) {
            playAudioFile(item.text, item.file, item.queueId || null);
          }
        })
        .catch(() => {
          // Silently ignore - no queued audio yet
        });
    }

    setInterval(pollForTTS, 1000);
    
    // /speak command handler
    window.speakText = function(text) {
      if (!text || text.trim() === '' || isSpeaking) return;
      
      ttsStatus.textContent = '🔄 Generiere...';
      
      fetch('/tts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text, voice: 'de-DE-ConradNeural' })
      })
      .then(r => r.json())
      .then(data => {
        if (data.success && data.file) {
          playAudioFile(text, data.file, data.queueId || null);
        }
      })
      .catch(e => {
        console.error('TTS Error:', e);
        ttsStatus.textContent = '✗ Fehler';
      });
    };

    window.submitSpeak = function() {
      const input = document.getElementById('speak-input');
      if (!input) return;
      const text = input.value.trim();
      if (!text) return;
      window.speakText(text);
      input.value = '';
      closeMenuOnMobile();
    };

    function updateHoldButton() {
      const btn = document.getElementById('btn-hold-to-speak');
      if (!btn) return;
      btn.classList.toggle('active', isListening);
      btn.textContent = isListening ? '🔴 Aufnahme läuft...' : '🗣️ Hold to Speak';
    }

    function startVoiceInput() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      const input = document.getElementById('speak-input');

      if (!SR) {
        ttsStatus.textContent = '✗ SpeechRecognition nicht unterstützt';
        return;
      }
      if (isListening) return;

      voiceRecognition = new SR();
      voiceRecognition.lang = 'de-DE';
      voiceRecognition.interimResults = true;
      voiceRecognition.continuous = true;

      voiceRecognition.onstart = () => {
        isListening = true;
        updateHoldButton();
        ttsStatus.textContent = '🎙️ Halten & sprechen...';
      };

      voiceRecognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        if (input) input.value = transcript.trim();
      };

      voiceRecognition.onerror = (event) => {
        ttsStatus.textContent = `✗ Mic Fehler: ${event.error}`;
      };

      voiceRecognition.onend = () => {
        const wasListening = isListening;
        isListening = false;
        updateHoldButton();
        if (!wasListening) return;
        const text = input?.value?.trim() || '';
        if (text) {
          ttsStatus.textContent = '🧠 Verarbeitet Spracheingabe...';
          window.submitSpeak();
        } else {
          ttsStatus.textContent = '✓ Spracheingabe beendet';
        }
      };

      voiceRecognition.start();
    }

    function stopVoiceInput() {
      if (voiceRecognition && isListening) {
        voiceRecognition.stop();
      }
    }

    document.getElementById('speak-input')?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        window.submitSpeak();
      }
    });

    const holdBtn = document.getElementById('btn-hold-to-speak');
    if (holdBtn) {
      holdBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        startVoiceInput();
      });
      holdBtn.addEventListener('pointerup', (e) => {
        e.preventDefault();
        stopVoiceInput();
      });
      holdBtn.addEventListener('pointerleave', () => stopVoiceInput());
      holdBtn.addEventListener('pointercancel', () => stopVoiceInput());
      holdBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        startVoiceInput();
      }, { passive: false });
      holdBtn.addEventListener('touchend', (e) => {
        e.preventDefault();
        stopVoiceInput();
      }, { passive: false });
    }

    // Keyboard controls for quick face testing
    window.addEventListener('keydown', (e) => {
      if (!currentVRM?.expressionManager) return;
      const map = {'1':'aa','2':'ih','3':'ou','4':'ee','5':'oh','q':'happy','w':'sad','e':'angry','r':'surprised'};
      const expr = map[e.key.toLowerCase()];
      if (expr) currentVRM.expressionManager.setValue(expr, 1);
    });

    window.addEventListener('keyup', (e) => {
      if (!currentVRM?.expressionManager) return;
      const map = {'1':'aa','2':'ih','3':'ou','4':'ee','5':'oh','q':'happy','w':'sad','e':'angry','r':'surprised'};
      const expr = map[e.key.toLowerCase()];
      if (expr) currentVRM.expressionManager.setValue(expr, 0);
    });

  </script>
</body>
</html>
